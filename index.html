<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Bat Animation</title>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0d1117; /* Fondo oscuro como en el video */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  /* Contenedor del murciélago */
  .bat-container {
    width: 400px;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #161b22;
    border-radius: 12px;
    border: 1px solid #30363d;
  }

  /* El murciélago - pixel art */
  .bat {
    width: 1px;
    height: 1px;
    transform: scale(6); /* Aumenté el scale para que se vea mejor */
    position: relative;
    left: 0; /* Quitamos el -128px que lo sacaba fuera */
    top: 0;
    background: #8d99ae; /* Color gris claro para que contraste */
    animation: 0.4s bat steps(1) infinite;
  }

  /* Animación con 2 frames de aleteo */
  @keyframes bat {
    0%, 100% {
      box-shadow: 
        /* Cuerpo */
        0px 2px 0 #8d99ae, 1px 2px 0 #8d99ae, 2px 2px 0 #8d99ae, 3px 2px 0 #8d99ae, 4px 2px 0 #8d99ae, 5px 2px 0 #8d99ae,
        0px 3px 0 #8d99ae, 1px 3px 0 #8d99ae, 2px 3px 0 #8d99ae, 3px 3px 0 #8d99ae, 4px 3px 0 #8d99ae, 5px 3px 0 #8d99ae,
        /* Cabeza */
        2px 0px 0 #8d99ae, 3px 0px 0 #8d99ae, 2px 1px 0 #8d99ae, 3px 1px 0 #8d99ae,
        /* Ojos */
        1px 1px 0 #000, 4px 1px 0 #000,
        /* ALAS ARRIBA */
        -3px 1px 0 #8d99ae, -2px 1px 0 #8d99ae, -1px 1px 0 #8d99ae,
        -4px 2px 0 #8d99ae, -3px 2px 0 #8d99ae, -2px 2px 0 #8d99ae, -1px 2px 0 #8d99ae,
        6px 1px 0 #8d99ae, 7px 1px 0 #8d99ae, 8px 1px 0 #8d99ae,
        6px 2px 0 #8d99ae, 7px 2px 0 #8d99ae, 8px 2px 0 #8d99ae;
    }
    50% {
      box-shadow: 
        /* Cuerpo */
        0px 2px 0 #8d99ae, 1px 2px 0 #8d99ae, 2px 2px 0 #8d99ae, 3px 2px 0 #8d99ae, 4px 2px 0 #8d99ae, 5px 2px 0 #8d99ae,
        0px 3px 0 #8d99ae, 1px 3px 0 #8d99ae, 2px 3px 0 #8d99ae, 3px 3px 0 #8d99ae, 4px 3px 0 #8d99ae, 5px 3px 0 #8d99ae,
        /* Cabeza */
        2px 0px 0 #8d99ae, 3px 0px 0 #8d99ae, 2px 1px 0 #8d99ae, 3px 1px 0 #8d99ae,
        /* Ojos */
        1px 1px 0 #000, 4px 1px 0 #000,
        /* ALAS ABAJO */
        -3px 3px 0 #8d99ae, -2px 3px 0 #8d99ae, -1px 3px 0 #8d99ae,
        -4px 4px 0 #8d99ae, -3px 4px 0 #8d99ae, -2px 4px 0 #8d99ae, -1px
